name: Clouds
options:
  bundleIdPrefix: no.oekalegon
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

# Shared.xcconfig is committed and always present (required — CI and
# fresh clones have no Local.xcconfig); it optionally includes the
# gitignored Config/Local.xcconfig for personal signing overrides (e.g.
# DEVELOPMENT_TEAM) — see Config/Local.xcconfig.example.
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

settings:
  base:
    SWIFT_VERSION: 6.0
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1

targets:
  Clouds:
    type: application
    platform: iOS
    sources:
      - path: Clouds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.oekalegon.Clouds
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~ipad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Clouds uses your location to record where you observed each cloud."
        INFOPLIST_KEY_NSCameraUsageDescription: "Clouds uses your camera to take a photo of an observed cloud."
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Clouds/Clouds.entitlements

  CloudsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CloudsTests
    dependencies:
      - target: Clouds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.oekalegon.CloudsTests
        GENERATE_INFOPLIST_FILE: YES

  CloudsUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CloudsUITests
    dependencies:
      - target: Clouds
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.oekalegon.CloudsUITests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Clouds:
    build:
      targets:
        Clouds: all
    test:
      targets:
        - CloudsTests
        - CloudsUITests
    run:
      config: Debug
